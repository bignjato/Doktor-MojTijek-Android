name: Sync Shared from iOS

on:
  push:
    branches: [ios-app]
    paths:
      - 'kmp-android/shared/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'bignjato/Doktor-MojTijek-Android'
    steps:
      - name: Checkout iOS repo
        uses: actions/checkout@v4
        with:
          repository: bignjato/Doktor-MojTijek
          ref: ios-app
          path: ios-source
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create sync PR
        run: |
          IOS_SHARED="ios-source/kmp-android/shared"
          if [ ! -d "$IOS_SHARED" ]; then
            echo "No shared module found in iOS repo"
            exit 0
          fi

          git clone https://github.com/bignjato/Doktor-MojTijek-Android.git android-target
          cd android-target

          SYNC_BRANCH="sync/ios-shared-$(date +%Y%m%d-%H%M%S)"

          rsync -av --exclude='build.gradle.kts' \
            "$IOS_SHARED/" \
            "shared/src/main/kotlin/com/mojtijek/shared/"

          git config user.name "Hermes CI"
          git config user.email "hermes@infobot.hr"
          git checkout -b "$SYNC_BRANCH"
          git add shared/src/main/
          git commit -m "sync: update shared from iOS ios-app $(date -u)"
          git push origin "$SYNC_BRANCH" -f

          gh pr create \
            --title "sync: shared module from iOS ios-app" \
            --body "Automated sync of shared business logic from iOS ios-app branch." \
            --base main \
            --head "bignjato:${SYNC_BRANCH}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
