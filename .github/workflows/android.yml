name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 35

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-configuration-cache
        working-directory: .

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mojtijek-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Copy APK to server
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            scp -o StrictHostKeyChecking=no app/build/outputs/apk/debug/app-debug.apk root@doktor.infobot.hr:/var/www/html/mojtijek.apk
          fi
        continue-on-error: true
