name: Build & Release APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '35'
  AGP_VERSION: '8.5.0'
  KOTLIN_VERSION: '2.0.21'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mojtijek-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          TAG="android-$(date +%Y%m%d)"
          NOTES="Android APK build from ${{ github.sha }}"
          if ! gh release view "$TAG" --repo ${{ github.repository }} 2>/dev/null; then
            gh release create "$TAG" --title "Android Build $(date +'%Y-%m-%d')" --notes "$NOTES" --repo ${{ github.repository }}
          fi
          gh release upload "$TAG" "$APK" --repo ${{ github.repository }} --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
